<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Foliune B · 叠影</title>
  <desc id="desc">错位照片边框与实心几何 F 交叠，负空间保留取景和收藏的线索。</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2a3037"/><stop offset="1" stop-color="#11151a"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#949fa9"/><stop offset="1" stop-color="#4a535d"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef1f4"/><stop offset="1" stop-color="#c5cdd5"/></linearGradient>
  </defs>
  <rect x="80" y="87" width="864" height="864" rx="190" fill="#000000" opacity=".16"/>
  <rect x="80" y="80" width="864" height="864" rx="190" fill="url(#tile)"/>
  <rect x="82" y="82" width="860" height="860" rx="188" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
