<!doctype html>
<html lang="zh-CN" data-variant="A" data-scene="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foliune · 材质关系原型</title>
<!-- Throwaway UI study: three material hierarchies on the SAME collection homepage.
     User explicitly requests fixed layout, navigation, album order, and real cover content;
     this overrides the prototype skill's default of structurally different layouts.
     A is a browser approximation of the single-layer glass baseline, never a native NS effect.
     Data: read-only snapshot of the isolated app.foliune.dark-review library, 2026-10-30.
     No application imports, requests, persistence, production route, or system-wallpaper changes.
     Open this file directly, or serve its directory with a static service managed by Avenil. -->
<style>
:root{color-scheme:dark;font:13px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;color:#eceef1;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0;min-width:660px}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid #d7e0ed;outline-offset:4px}button svg{flex-shrink:0}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}button:hover{color:#fff}
.desktop-scene{position:fixed;inset:0;z-index:-1;background:linear-gradient(140deg,#e0e3e5 0%,#bdc8d1 42%,#ddd9cf 100%)}
[data-scene="dark"] .desktop-scene{background:linear-gradient(135deg,#101922,#293541 48%,#11161c)}
[data-scene="color"] .desktop-scene{background:linear-gradient(115deg,#445966 0% 22%,#9e897a 22% 45%,#758477 45% 66%,#6e6678 66% 84%,#3f515a 84%)}
.study-tools{max-width:1320px;margin:18px auto 16px;padding:14px 18px;background:#12151ae8;border:1px solid #ffffff2b;border-radius:12px;box-shadow:0 4px 20px #0002}
.study-warning{margin:0 0 12px;font-size:14px;font-weight:600;color:#fff;letter-spacing:.015em}
.study-options{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.scene-buttons{display:flex;gap:3px;flex-shrink:0;background:#ffffff07;padding:3px;border-radius:8px}.scene-buttons button{min-height:32px;padding:5px 12px;border-radius:5px;color:#c3c8d0;font-size:12px}.scene-buttons button[aria-pressed="true"]{background:#d8dde4;color:#20252c}.study-description{color:#c9cdd4;font-size:12px;min-width:200px;flex:1}
.window{width:min(1320px,calc(100vw - 48px));height:min(880px,calc(100dvh - 182px));min-height:480px;margin:0 auto 86px;display:flex;flex-direction:column;position:relative;overflow:hidden;isolation:isolate;border-radius:14px;color:#eceef1;--muted:#b5b8bf;--button-bg:linear-gradient(180deg,#ffffff24,#ffffff15);--button-edge:#e5e9f036;--button-shadow:inset 0 1px 0 #ffffff12,0 1px 3px #0000001a;--cover-bg:linear-gradient(180deg,#ffffff04,#ffffff01);--cover-shadow:none;--cover-edge:transparent;--modal-bg:#292c31f5}
.traffic{position:absolute;left:16px;top:14px;display:flex;gap:8px;pointer-events:none}.traffic i{width:11px;height:11px;border-radius:50%;background:#ee6a65;box-shadow:inset 0 0 0 1px #0002}.traffic i:nth-child(2){background:#dfb75b}.traffic i:nth-child(3){background:#77b36b}
.app-header{height:80px;flex-shrink:0;padding:32px 36px 8px;display:grid;grid-template-columns:minmax(120px,1fr) auto minmax(120px,1fr);align-items:center;gap:20px}.brand{font:400 21px/1.5 Georgia,serif;letter-spacing:-.65px}.brand span{color:var(--muted)}
.primary-nav{display:flex;gap:3px;padding:3px;border:1px solid #ffffff0d;border-radius:21px;background:linear-gradient(180deg,#ffffff09,#ffffff04);box-shadow:inset 0 1px 0 #ffffff06,0 2px 6px #0000000c}.primary-nav button{min-width:72px;min-height:32px;padding:5px 20px;border:1px solid transparent;border-radius:17px;font-size:12px;color:var(--muted)}.primary-nav button[aria-current="page"]{font-weight:500;color:#282c32;background:linear-gradient(180deg,#d5d9de,#c1c6cd);border-color:#edf0f34d;box-shadow:0 1px 3px #0003,inset 0 1px 0 #ffffff45}
.header-tools{justify-self:end;display:flex;gap:8px}.icon-button{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:8px;color:var(--muted)}.icon-button:hover{background:#ffffff0c}.header-tools .icon-button:active{background:#ffffff20}
main{flex:1;min-height:0;overflow:auto;padding:18px 36px 36px;scrollbar-width:thin;scrollbar-color:#9aa1ad66 transparent}.intro{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:20px}.intro-copy{display:flex;gap:14px;align-items:baseline}h1{margin:0;font-size:24px;font-weight:400;letter-spacing:-.025em;line-height:1.35}.album-total{font-size:12px;color:var(--muted);white-space:nowrap}.action{min-height:36px;padding:7px 12px;display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--button-edge);border-radius:8px;font-size:12px;line-height:1.5;color:#f0f2f5;background:var(--button-bg);box-shadow:var(--button-shadow)}.action:hover{filter:brightness(1.08)}.action:active{filter:brightness(.96)}
.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px;row-gap:28px;align-items:start}.album{min-width:0}.album-open{display:block;width:100%;padding:0;text-align:left;border-radius:5px}.cover{position:relative;aspect-ratio:3/2;width:100%;display:flex;align-items:center;justify-content:center;background:var(--cover-bg);box-shadow:var(--cover-shadow);border:1px solid var(--cover-edge);border-radius:5px;overflow:hidden}.cover img{position:absolute;inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:contain;object-position:center bottom}.cover-empty svg{width:24px;height:24px;color:#b5b8bf99}.caption{padding:11px 2px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.album-name{font-size:13px;font-weight:400;line-height:1.5;overflow-wrap:anywhere}.album-count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.album-count small{font-size:11px;margin-left:2px}.album-open:hover .album-name{color:#fff}.album-open:focus-visible{outline-offset:7px}
/* A — one environment-responsive surface, matching the current material hierarchy. */
[data-variant="A"] .window{background:rgba(8,10,13,.68);background-image:linear-gradient(135deg,#ffffff06,transparent 42%,#00000008);backdrop-filter:blur(28px) saturate(115%);-webkit-backdrop-filter:blur(28px) saturate(115%);box-shadow:inset 0 1px 0 #ffffff08,inset 0 0 0 1px #ffffff04,0 20px 70px #0004}
[data-variant="A"] .cover-empty{background:linear-gradient(180deg,#ffffff08,#ffffff04)}
/* B — stable smoked substrate, a lit glass rim, restrained photo shelves, metal controls. */
[data-variant="B"] .window{background:linear-gradient(180deg,#ffffff0d,transparent 160px),rgba(10,12,16,.84);backdrop-filter:blur(34px) saturate(70%);-webkit-backdrop-filter:blur(34px) saturate(70%);box-shadow:inset 0 1px 0 #ffffff35,inset 0 0 0 1px #d6e1ed20,0 20px 70px #0006;--muted:#b9bec7;--button-bg:linear-gradient(180deg,#6b7078,#4c5159 48%,#444951 51%,#4e535b);--button-edge:#e1e7ee30;--button-shadow:inset 0 1px 0 #ffffff35,inset 0 -1px 0 #0005,0 2px 5px #0004;--cover-bg:linear-gradient(180deg,#ffffff06,#ffffff02);--cover-edge:#ffffff07;--cover-shadow:inset 0 1px 0 #ffffff06,0 4px 12px #00000016;--modal-bg:#24282ef5}
[data-variant="B"] .primary-nav{background:linear-gradient(180deg,#11151a99,#20252bcc);box-shadow:inset 0 1px 3px #0005,0 1px 0 #ffffff12;border-color:#d0d9e51a}
[data-variant="B"] .primary-nav button[aria-current="page"]{background:linear-gradient(180deg,#d5d9de,#b4bbc4 48%,#a7afb9 51%,#c3cad2);box-shadow:inset 0 1px 0 #fff9,inset 0 -1px 0 #0003,0 2px 4px #0005;border-color:#edf1f45c}
[data-variant="B"] .header-tools .icon-button{background:linear-gradient(180deg,#ffffff0b,#ffffff02);box-shadow:inset 0 1px 0 #ffffff09,0 1px 3px #0002}
[data-variant="B"] .cover-empty{background:linear-gradient(180deg,#ffffff08,#ffffff03)}
/* C — environment belongs to the outer glass; neutral gallery owns image comparison. */
[data-variant="C"] .window{background:rgba(15,18,23,.68);backdrop-filter:blur(20px) saturate(55%);-webkit-backdrop-filter:blur(20px) saturate(55%);box-shadow:inset 0 1px 0 #ffffff18,inset 0 0 0 1px #ffffff0c,0 20px 70px #0005;--muted:#b3b7bf;--button-bg:#ffffff0c;--button-edge:#ffffff2d;--button-shadow:inset 0 1px 0 #ffffff08;--cover-bg:transparent;--cover-shadow:none;--modal-bg:#24262af8}
[data-variant="C"] main{background:linear-gradient(180deg,rgba(24,26,29,.84),rgba(24,26,29,.96));box-shadow:inset 0 18px 36px -32px #0009}
[data-variant="C"] .primary-nav{background:#ffffff04;box-shadow:none;border-color:#ffffff0a}
[data-variant="C"] .primary-nav button[aria-current="page"]{background:#d1d5db;box-shadow:0 1px 2px #0003;border-color:#e2e6eb40}
[data-variant="C"] .cover{border-color:transparent}
[data-variant="C"] .cover-empty{background:#ffffff02}
.prototype-switcher{position:fixed;z-index:20;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px;border:1px solid #fff8;border-radius:30px;background:#eceff3;color:#222831;box-shadow:0 6px 28px #0004}.prototype-switcher button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#252d38}.prototype-switcher button:hover{color:#111;background:#cfd6df}.variant-label{min-width:214px;text-align:center;font-weight:500;font-size:13px}.prototype-switcher button svg{width:17px;height:17px}
dialog{width:min(460px,calc(100vw - 48px));max-height:calc(100dvh - 64px);padding:24px;margin:auto;border:1px solid #ffffff29;border-radius:16px;color:#eceef1;background:var(--modal-bg,#292c31f5);box-shadow:inset 0 1px 0 #ffffff0b,0 20px 60px #0007;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}dialog::backdrop{background:#080b1099;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.dialog-heading h2{margin:0;font-size:15px;font-weight:500}.dialog-heading .icon-button{margin:-7px -8px -7px 0}.dialog-actions{margin-top:24px;display:flex;justify-content:flex-end;gap:8px}label{display:flex;flex-direction:column;gap:8px;color:#c3c8d0;font-size:12px}input{min-height:38px;border:1px solid #ffffff29;border-radius:7px;background:#12161d80;color:#eceef1;padding:8px 11px}.dialog-copy{color:#b9bfc8;font-size:13px;line-height:1.8;margin:0}.preview-dialog{width:min(1040px,calc(100vw - 48px))}.preview-image{display:block;width:100%;height:65vh;object-fit:contain;background:#1b1d20}.preview-empty{min-height:180px;display:grid;place-items:center;background:#ffffff03;color:#aeb5bf;border-radius:8px}.readonly-note{font-size:12px;color:#b9bfc8;margin:16px 0 0}
@media(max-width:1380px){.study-tools{margin-inline:24px}}
@media(max-width:1100px){.albums{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}}
@media(max-width:900px){.app-header{padding-inline:24px;gap:12px}.primary-nav button{min-width:64px;padding-inline:16px}main{padding:18px 26px 32px}.study-options{gap:10px}.study-description{flex-basis:100%}.window{height:calc(100dvh - 208px)}.study-warning{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="desktop-scene" aria-hidden="true"></div>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M4 6h4m4 0h8M4 18h8m4 0h4"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 3h10v12H3V7Z"/><path d="M12 11v6m-3-3h6"/></symbol>
<symbol id="image" viewBox="0 0 24 24"><rect x="5" y="3" width="16" height="16" rx="2"/><path d="M2 7v15h15m-12-9 4-4 4 4 4-3 4 4"/><circle cx="16" cy="7" r="1.5"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6M4 12h12"/></symbol>
</defs></svg>
<aside class="study-tools" aria-label="原型工具">
<p class="study-warning">材质关系原型 · 浏览器模拟，系统毛玻璃待原生验证</p>
<div class="study-options"><div class="scene-buttons" aria-label="页面模拟背景"><button type="button" data-scene-choice="light">浅色背景</button><button type="button" data-scene-choice="dark">深色背景</button><button type="button" data-scene-choice="color">复杂背景</button></div><output class="study-description" id="description" aria-live="polite"></output></div>
</aside>
<section class="window" aria-label="Foliune 收藏首页材质预览">
<div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="app-header"><span class="brand">Foliune<span>.</span></span><nav class="primary-nav" aria-label="工作区"><button type="button" aria-current="page" data-readonly="收藏">收藏</button><button type="button" data-readonly="作品">作品</button><button type="button" data-readonly="画册">画册</button></nav><div class="header-tools"><button type="button" class="icon-button" aria-label="搜索" id="search-open"><svg><use href="#search"/></svg></button><button type="button" class="icon-button" aria-label="设置" data-readonly="设置"><svg><use href="#settings"/></svg></button></div></header>
<main><div class="intro"><div class="intro-copy"><h1>收藏相簿</h1><span class="album-total">4 本相簿</span></div><button type="button" class="action" id="create-open"><svg><use href="#folder"/></svg>新建相簿</button></div><div class="albums" id="albums"></div></main>
</section>
<nav class="prototype-switcher" aria-label="材质方案切换"><button type="button" id="previous" aria-label="上一个材质方案"><svg><use href="#left"/></svg></button><output class="variant-label" id="variant-label" aria-live="polite"></output><button type="button" id="next" aria-label="下一个材质方案"><svg><use href="#right"/></svg></button></nav>
<dialog id="create-dialog"><div class="dialog-heading"><h2>新建相簿 · 原型</h2><button type="button" class="icon-button" data-close aria-label="关闭"><svg><use href="#close"/></svg></button></div><form id="create-form"><label>相簿名称<input name="name" maxlength="80" placeholder="输入名称，查看控件材质" required></label><p class="readonly-note">仅在本原型预览，不会创建或修改相簿。</p><div class="dialog-actions"><button type="button" class="action" data-close>取消</button><button type="submit" class="action">完成预览</button></div></form></dialog>
<dialog id="preview-dialog" class="preview-dialog"><div class="dialog-heading"><h2 id="preview-title"></h2><button type="button" class="icon-button" data-close aria-label="关闭"><svg><use href="#close"/></svg></button></div><div id="preview-content"></div><p class="readonly-note">只读封面预览 · 原图与图库未作更改</p></dialog>
<dialog id="readonly-dialog"><div class="dialog-heading"><h2 id="readonly-title"></h2><button type="button" class="icon-button" data-close aria-label="关闭"><svg><use href="#close"/></svg></button></div><p class="dialog-copy">本原型仅比较同一收藏首页的材质关系。</p><div class="dialog-actions"><button type="button" class="action" data-close>返回预览</button></div></dialog>
<dialog id="search-dialog"><div class="dialog-heading"><h2>搜索 · 只读预览</h2><button type="button" class="icon-button" data-close aria-label="关闭"><svg><use href="#close"/></svg></button></div><label>搜索照片<input placeholder="标题、标签、地点或标注"></label><p class="readonly-note">仅预览输入框，不连接图库搜索。</p></dialog>
<script>
const variants = {
 A: {name:'单层玻璃基线', description:'A · 外壳、展区与控件共享环境参与，近似当前单层玻璃。'},
 B: {name:'熏黑玻璃', description:'B · 深色基底承托，顶光与边缘表达玻璃，封面轻承托、控件金属触感。'},
 C: {name:'画廊材质', description:'C · 环境留在外壳，中性展区稳定照片判断，内容与控制层各司其职。'}
};
const albums = [
 {name:'Selection review 65', count:65, src:'assets/landscape.jpg'},
 {name:'Quiet review ·', count:0, src:null},
 {name:'Quiet review · Square', count:1, src:'assets/square.jpg'},
 {name:'Quiet review · Portrait', count:1, src:'assets/portrait.jpg'}
];
const root = document.documentElement;
let variant='A', scene='light';
function syncState(){
 const params=new URL(location.href).searchParams;
 variant=Object.hasOwn(variants,params.get('variant'))?params.get('variant'):'A';
 scene=['light','dark','color'].includes(params.get('scene'))?params.get('scene'):'light';
 root.dataset.variant=variant; root.dataset.scene=scene;
 document.querySelector('#description').textContent=variants[variant].description;
 document.querySelector('#variant-label').textContent=variant+' — '+variants[variant].name;
 document.querySelectorAll('[data-scene-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.sceneChoice===scene)));
 const materials=getComputedStyle(document.querySelector('.window'));
 document.querySelectorAll('dialog').forEach(dialog=>['--modal-bg','--button-bg','--button-edge','--button-shadow'].forEach(token=>dialog.style.setProperty(token,materials.getPropertyValue(token))));
}
function setState(key,value){const url=new URL(location.href);url.searchParams.set(key,value);history.replaceState(null,'',url);syncState()}
function cycle(offset){const keys=Object.keys(variants);setState('variant',keys[(keys.indexOf(variant)+offset+keys.length)%keys.length])}
document.querySelector('#previous').onclick=()=>cycle(-1);
document.querySelector('#next').onclick=()=>cycle(1);
document.querySelectorAll('[data-scene-choice]').forEach(button=>button.onclick=()=>setState('scene',button.dataset.sceneChoice));
window.addEventListener('popstate',syncState);
window.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing)return;
 const target=event.target;
 if(target instanceof Element && (target.closest('input,textarea,select,[contenteditable]') || document.querySelector('dialog[open]')))return;
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}
});
function openDialog(id){document.querySelector('#'+id).showModal()}
document.querySelector('#albums').replaceChildren(...albums.map(album=>{
 const article=document.createElement('article');article.className='album';
 const button=document.createElement('button');button.type='button';button.className='album-open';button.setAttribute('aria-label','只读预览相簿 '+album.name+'，'+album.count+' 张照片');
 const cover=document.createElement('div');cover.className='cover'+(album.src?'':' cover-empty');
 if(album.src){const img=document.createElement('img');img.src=album.src;img.alt='';cover.append(img)}else cover.innerHTML='<svg aria-hidden="true"><use href="#image"/></svg>';
 const caption=document.createElement('div');caption.className='caption';
 const name=document.createElement('span');name.className='album-name';name.textContent=album.name;
 const count=document.createElement('span');count.className='album-count';count.innerHTML=album.count+' <small>张</small>';
 caption.append(name,count);button.append(cover,caption);article.append(button);
 button.onclick=()=>{
  document.querySelector('#preview-title').textContent=album.name;
  const content=document.querySelector('#preview-content');content.replaceChildren();
  const element=document.createElement(album.src?'img':'div');element.className=album.src?'preview-image':'preview-empty';
  if(album.src){element.src=album.src;element.alt=album.name+' 相簿封面'}else element.textContent='相簿为空';
  content.append(element);openDialog('preview-dialog');
 };
 return article;
}));
document.querySelector('#create-open').onclick=()=>openDialog('create-dialog');
document.querySelector('#create-form').onsubmit=event=>{event.preventDefault();document.querySelector('#create-dialog').close()};
document.querySelector('#search-open').onclick=()=>openDialog('search-dialog');
document.querySelectorAll('[data-readonly]').forEach(button=>button.onclick=()=>{document.querySelector('#readonly-title').textContent=button.dataset.readonly+' · 只读预览';openDialog('readonly-dialog')});
document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>button.closest('dialog').close());
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()}));
syncState();
</script>
</body>
</html>
