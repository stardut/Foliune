name: Release macOS app

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新构建并发布的已有版本 tag（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon DMG
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out existing tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"

      - name: Validate tag and prepare release version
        run: node scripts/prepare-release.mjs

      - name: Test release preparation
        run: node --test scripts/prepare-release.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build ad-hoc signed DMG
        timeout-minutes: 25
        env:
          # Tauri skips Finder layout and background setup when CI=true unless opted in.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: >-
          pnpm --filter @foliune/desktop tauri build --ci
          --target aarch64-apple-darwin --bundles app,dmg
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          -- --locked

      - name: Verify local DMG and app signature
        id: verify-dmg
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          app_path="$bundle_dir/macos/Foliune.app"
          lipo "$app_path/Contents/MacOS/foliune" -verify_arch arm64
          codesign --verify --deep --strict "$app_path"
          signature_info="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature_info"; then
            echo "Expected an ad-hoc signed Foliune.app." >&2
            exit 1
          fi
          shopt -s nullglob
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          if [ "${#dmg_paths[@]}" -ne 1 ] || [ ! -s "${dmg_paths[0]}" ]; then
            echo "Expected exactly one nonempty DMG for $TAG_NAME." >&2
            exit 1
          fi
          hdiutil verify "${dmg_paths[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -noverify -nobrowse -noautoopen -mountpoint "$mount_dir" "${dmg_paths[0]}"
          trap 'hdiutil detach "$mount_dir" && rmdir "$mount_dir"' EXIT
          if [ ! -s "$mount_dir/.DS_Store" ] || [ ! -s "$mount_dir/.background/background.png" ]; then
            echo "Expected Finder layout and background in the DMG." >&2
            exit 1
          fi
          if [ "$(readlink "$mount_dir/Applications")" != "/Applications" ]; then
            echo "Expected the Applications link to point to /Applications." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$mount_dir/Foliune.app"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          trap - EXIT
          shasum -a 256 "${dmg_paths[0]}"
          printf 'path=%s\n' "${dmg_paths[0]}" >> "$GITHUB_OUTPUT"

      - name: Stage verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: ${{ steps.verify-dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download verified DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-${{ github.run_id }}
          path: release-artifact

      - name: Publish verified DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_paths=(release-artifact/*.dmg)
          if [ "${#dmg_paths[@]}" -ne 1 ] || [ ! -s "${dmg_paths[0]}" ]; then
            echo "Expected exactly one nonempty staged DMG for $TAG_NAME." >&2
            exit 1
          fi
          dmg_path="${dmg_paths[0]}"
          asset_name="$(basename "$dmg_path")"
          asset_name_encoded="$(printf '%s' "$asset_name" | jq -sRr @uri)"

          find_release() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s --arg tag "$TAG_NAME" '[.[][] | select(.tag_name == $tag)] | first'
          }

          release_json="$(find_release)"
          if [ "$release_json" = "null" ]; then
            release_notes=$'## 安装\n\n下载下方 DMG，打开后将 Foliune 拖入 Applications。\n\n此安装包仅面向 Apple Silicon，采用 ad-hoc 签名，未经 Apple Developer ID 签名或公证；macOS 可能阻止首次打开。最低系统要求沿用应用配置，实际兼容系统仍需实机验证。'
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Foliune $TAG_NAME" --notes "$release_notes" --generate-notes
            release_json="$(find_release)"
          fi

          release_id="$(jq -er '.id' <<< "$release_json")"
          existing_asset="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | [.state, (.size // 0)] | @tsv' <<< "$release_json")"
          if [ -n "$existing_asset" ]; then
            read -r existing_state existing_size <<< "$existing_asset"
            if [ "$existing_state" != "uploaded" ] || [ "$existing_size" -le 0 ]; then
              echo "Existing DMG is incomplete: $asset_name (state=$existing_state, size=$existing_size)." >&2
              exit 1
            fi
            echo "Preserving existing complete DMG: $asset_name"
          else
            upload_url="$(jq -er '.upload_url | split("{")[0]' <<< "$release_json")"
            gh api --method POST "${upload_url}?name=${asset_name_encoded}" \
              --header "Content-Type: application/octet-stream" --input "$dmg_path" >/dev/null
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e --arg name "$asset_name" \
            'any(.assets[]; .name == $name and .state == "uploaded" and (.size // 0) > 0)' \
            <<< "$release_json" >/dev/null
          if [ "$(jq -r '.draft' <<< "$release_json")" = "true" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false >/dev/null
          fi

          final_release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          jq -e --arg tag "$TAG_NAME" --arg name "$asset_name" \
            '.tag_name == $tag and .draft == false and any(.assets[]; .name == $name and .state == "uploaded" and (.size // 0) > 0)' \
            <<< "$final_release_json" >/dev/null
          echo "Published GitHub Release $TAG_NAME with DMG $asset_name."
