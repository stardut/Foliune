name: Release macOS app

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新构建并发布的已有版本 tag（如 v0.1.0；请从 main 运行）"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon release assets
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      updater: ${{ steps.source.outputs.updater }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TAG_NAME: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run a manual release from main so the website can be refreshed after publication." >&2
            exit 1
          fi

      - name: Check out existing tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and detect updater support
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")" != "$(git rev-parse HEAD)" ] ||
              ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release tag must point to the checked-out commit in main history." >&2
            exit 1
          fi
          if [ -f scripts/updater-release.mjs ]; then
            echo 'updater=true' >> "$GITHUB_OUTPUT"
          else
            echo 'updater=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"

      - name: Validate tag and prepare release version
        run: node scripts/prepare-release.mjs

      - name: Test release preparation
        run: node --test scripts/prepare-release.test.mjs

      - name: Prepare updater configuration
        if: steps.source.outputs.updater == 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/updater-release.mjs config "$RUNNER_TEMP/tauri-release.json"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build legacy ad-hoc signed DMG
        if: steps.source.outputs.updater == 'false'
        timeout-minutes: 25
        env:
          # Tauri skips Finder layout and background setup when CI=true unless opted in.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: >-
          pnpm --filter @foliune/desktop tauri build --ci
          --target aarch64-apple-darwin --bundles app,dmg
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          -- --locked

      - name: Build release app with updater configuration
        if: steps.source.outputs.updater == 'true'
        timeout-minutes: 25
        run: >-
          pnpm --filter @foliune/desktop tauri build --ci --no-bundle
          --target aarch64-apple-darwin --config "$RUNNER_TEMP/tauri-release.json"
          -- --locked

      - name: Bundle ad-hoc signed DMG and sign updater archive
        if: steps.source.outputs.updater == 'true'
        timeout-minutes: 10
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required." >&2
            exit 1
          fi
          pnpm --filter @foliune/desktop tauri bundle --ci --target aarch64-apple-darwin \
            --bundles app,dmg --config "$RUNNER_TEMP/tauri-release.json"

      - name: Verify local DMG and app signature
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          app_path="$bundle_dir/macos/Foliune.app"
          lipo "$app_path/Contents/MacOS/foliune" -verify_arch arm64
          codesign --verify --deep --strict "$app_path"
          signature_info="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature_info"; then
            echo "Expected an ad-hoc signed Foliune.app." >&2
            exit 1
          fi
          shopt -s nullglob
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          if [ "${#dmg_paths[@]}" -ne 1 ] || [ ! -s "${dmg_paths[0]}" ]; then
            echo "Expected exactly one nonempty DMG for $TAG_NAME." >&2
            exit 1
          fi
          hdiutil verify "${dmg_paths[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -noverify -nobrowse -noautoopen -mountpoint "$mount_dir" "${dmg_paths[0]}"
          trap 'hdiutil detach "$mount_dir" && rmdir "$mount_dir"' EXIT
          if [ ! -s "$mount_dir/.DS_Store" ] || [ ! -s "$mount_dir/.background/background.png" ]; then
            echo "Expected Finder layout and background in the DMG." >&2
            exit 1
          fi
          if [ "$(readlink "$mount_dir/Applications")" != "/Applications" ]; then
            echo "Expected the Applications link to point to /Applications." >&2
            exit 1
          fi
          codesign --verify --deep --strict "$mount_dir/Foliune.app"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          trap - EXIT
          shasum -a 256 "${dmg_paths[0]}"
          mkdir -p "$RUNNER_TEMP/release-artifact"
          cp "${dmg_paths[0]}" "$RUNNER_TEMP/release-artifact/"

      - name: Verify and stage updater archive and signature
        if: steps.source.outputs.updater == 'true'
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          node scripts/updater-release.mjs verify "$bundle_dir"
          cp "$bundle_dir/Foliune.app.tar.gz" "$bundle_dir/Foliune.app.tar.gz.sig" "$RUNNER_TEMP/release-artifact/"

      - name: Stage verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-${{ github.run_id }}
          path: release-artifact

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          UPDATER_ENABLED: ${{ needs.build.outputs.updater }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/publish-release.mjs release-artifact

  deploy-website:
    name: Deploy website after release publication
    needs: publish
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
