name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CI Tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Test link import extraction
        run: node apps/desktop/src-tauri/src/link_import_extract_tests.js

      - name: Test release preparation
        run: pnpm test:release

      - name: Test website deployment guard
        run: pnpm test:pages

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  build:
    name: CI Build macOS
    runs-on: macos-15
    timeout-minutes: 35
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: "24.3.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app
        run: >-
          pnpm --filter @foliune/desktop tauri build --ci --no-bundle
          --target aarch64-apple-darwin -- --locked
